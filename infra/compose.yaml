services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memora}
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - memora_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
    environment:
      MEMORA_ENVIRONMENT: local
      MEMORA_DATABASE_URL: ${MEMORA_DATABASE_URL:?Set MEMORA_DATABASE_URL in .env}
    ports:
      - "127.0.0.1:${MEMORA_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  memora_postgres:
