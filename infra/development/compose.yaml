services:
  api:
    image: memora-backend:${MEMORA_IMAGE_TAG:?Set MEMORA_IMAGE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - ${MEMORA_ENV_FILE:?Set MEMORA_ENV_FILE}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - memora_private

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MEMORA_DEV_DOMAIN: ${MEMORA_DEV_DOMAIN:?Set MEMORA_DEV_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - memora_private

networks:
  memora_private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
