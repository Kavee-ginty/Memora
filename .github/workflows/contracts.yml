name: API contracts

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "tools/contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "contracts/**"
      - "tools/contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    name: OpenAPI and Dart client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.0"

      - name: Cache OpenAPI generator
        uses: actions/cache@v6
        with:
          path: tools/.cache/openapi-generator
          key: openapi-generator-${{ runner.os }}-${{ hashFiles('tools/contracts/openapi-generator.json') }}

      - name: Run backend contract tests
        run: |
          python -m pytest \
            backend/tests/test_api_contract_models.py \
            backend/tests/test_openapi_contract.py \
            backend/tests/test_openapi_artifact.py

      - name: Check OpenAPI artifact and Dart client drift
        run: python tools/contracts/generate_contracts.py --check

      - name: Install generated client dependencies
        working-directory: contracts/dart/memora_api_client
        run: dart pub get --enforce-lockfile

      - name: Analyze generated client
        working-directory: contracts/dart/memora_api_client
        run: |
          dart analyze --no-fatal-warnings > analyze_output.txt
          cat analyze_output.txt
          actual=$(awk '/^ *warning -/{print $NF}' analyze_output.txt | sort || true)
          expected=$'strict_raw_type\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import\nunused_import'
          if [ "$actual" != "$expected" ]; then
            echo "Analyzer warning baseline changed; expected exactly:"
            echo "$expected"
            echo "Got:"
            echo "$actual"
            exit 1
          fi

      - name: Install client contract test dependencies
        working-directory: contracts/dart/memora_api_client_contract_tests
        run: dart pub get --enforce-lockfile

      - name: Analyze client contract tests
        working-directory: contracts/dart/memora_api_client_contract_tests
        run: dart analyze --fatal-infos

      - name: Run client contract tests
        working-directory: contracts/dart/memora_api_client_contract_tests
        run: dart test
