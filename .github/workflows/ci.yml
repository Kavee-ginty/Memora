name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Check formatting
        run: python -m ruff format --check backend
      - name: Lint
        run: python -m ruff check backend
      - name: Run tests
        run: |
          if [ -f backend/tests/test_migrations.py ]; then
            python -m pytest backend/tests --ignore=backend/tests/test_migrations.py
          else
            python -m pytest backend/tests
          fi

  flutter:
    name: Flutter format, analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

  migrations:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memora_ci
          POSTGRES_USER: memora_ci
          POSTGRES_PASSWORD: memora_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memora_ci -d memora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMORA_ENVIRONMENT: local
      MEMORA_DATABASE_URL: postgresql+psycopg://memora_ci:memora_ci_only@127.0.0.1:5432/memora_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect T04 migration tooling
        id: detect
        run: |
          alembic=false
          if [ -f backend/alembic.ini ] && [ -f backend/migrations/env.py ]; then
            alembic=true
          fi
          tests=false
          if [ -f backend/tests/test_migrations.py ]; then
            tests=true
          fi
          echo "alembic=$alembic" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          if [ "$alembic" = true ] || [ "$tests" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration checks skipped::T04 migration tooling is not present in this checkout."
          fi
      - name: Require Alembic configuration for migration tests
        if: steps.detect.outputs.tests == 'true' && steps.detect.outputs.alembic != 'true'
        run: |
          echo "::error title=Migration configuration missing::T04 migration tests are present, but backend/alembic.ini and backend/migrations/env.py are not both present. Add the Alembic configuration or update this workflow with a documented alternative before running migration tests."
          exit 1
      - name: Install Python
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies
        if: steps.detect.outputs.enabled == 'true'
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Apply migrations to an empty database
        if: steps.detect.outputs.alembic == 'true'
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run migration and question database contract tests
        if: steps.detect.outputs.tests == 'true'
        working-directory: backend
        env:
          MEMORA_TEST_DATABASE_URL: ${{ env.MEMORA_DATABASE_URL }}
        run: |
          python -m pytest tests/test_migrations.py
          python -m pytest tests/test_question_db_contracts.py

  contracts:
    name: OpenAPI and Dart client
    uses: ./.github/workflows/contracts.yml

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.lock --require-hashes --strict --progress-spinner off
          python -m pip_audit -r backend/requirements-dev.lock --require-hashes --strict --progress-spinner off
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            git --redact --no-banner --verbose --exit-code 1 --log-opts=--all /repo
      - name: Scan repository dependencies and secrets
        run: |
          cache="${RUNNER_TEMP}/trivy-cache"
          mkdir -p "$cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs .venv \
            --skip-dirs mobile/build \
            --skip-dirs mobile/.dart_tool \
            /repo

  flutter-build:
    name: Flutter debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memora-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  container:
    name: Backend container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build --pull -t memora-backend:ci backend
      - name: Export backend image
        run: docker save memora-backend:ci -o backend-image.tar
      - name: Generate CycloneDX SBOM
        run: |
          cache="${RUNNER_TEMP}/trivy-cache"
          mkdir -p "$cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --input /work/backend-image.tar \
            --scanners vuln \
            --format cyclonedx \
            --output /work/backend-image.cdx.json \
            --no-progress
      - name: Record image vulnerabilities
        run: |
          cache="${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --input /work/backend-image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --output /work/backend-image-vulnerabilities.txt \
            --no-progress
      - name: Upload backend image and reports
        uses: actions/upload-artifact@v4
        with:
          name: memora-backend-image
          path: |
            backend-image.tar
            backend-image.cdx.json
            backend-image-vulnerabilities.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce fixable image vulnerabilities
        run: |
          cache="${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --input /work/backend-image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend
      - flutter
      - compose
      - migrations
      - contracts
      - security
      - flutter-build
      - container
    if: always()
    steps:
      - name: Verify required jobs passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          FLUTTER_BUILD_RESULT: ${{ needs.flutter-build.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          printf 'backend=%s\nflutter=%s\ncompose=%s\nmigrations=%s\ncontracts=%s\nsecurity=%s\nflutter-build=%s\ncontainer=%s\n' \
            "$BACKEND_RESULT" "$FLUTTER_RESULT" "$COMPOSE_RESULT" "$MIGRATIONS_RESULT" \
            "$CONTRACTS_RESULT" "$SECURITY_RESULT" "$FLUTTER_BUILD_RESULT" "$CONTAINER_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$FLUTTER_RESULT" = "success"
          test "$COMPOSE_RESULT" = "success"
          test "$MIGRATIONS_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$FLUTTER_BUILD_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
