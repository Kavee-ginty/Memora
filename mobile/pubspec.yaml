name: memora_mobile
description: Memora student mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.7.0 <6.0.0"
  flutter_riverpod: ">=2.6.0 <3.0.0"
  go_router: ">=14.6.0 <15.0.0"
  supabase_flutter: ">=2.8.0 <3.0.0"
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  memora_api_client:
    path: ../contracts/dart/memora_api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  built_collection: ">=5.1.1 <6.0.0"
  built_value: ">=8.9.2 <9.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/fonts/

  fonts:
    - family: Exo
      fonts:
        - asset: assets/fonts/Exo-400.ttf
          weight: 400
        - asset: assets/fonts/Exo-500.ttf
          weight: 500
        - asset: assets/fonts/Exo-600.ttf
          weight: 600
        - asset: assets/fonts/Exo-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
